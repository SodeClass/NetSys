media:
  input: content/images
  output: images

content:
  - name: tags
    label: "タグ管理"
    type: collection
    path: content/tags
    filename: "{id}.yml"
    format: yaml
    view:
      primary: title
    fields:
      - name: title
        label: "タグ名"
        type: string
        required: true
      - name: sort_order
        label: "並び順（数字が小さいほど先頭）"
        type: number
        default: 100
      - name: is_visible
        label: "トップページに表示するか"
        type: boolean
        default: true
      - name: id
        label: "ファイル名（半角英数字）"
        type: string
        required: true

  - name: settings
    label: "サイト設定"
    type: file
    path: content/settings.yml
    fields:
      - name: default_tag
        label: "デフォルト表示タグ"
        type: reference
        options:
          collection: tags
          value: "{title}"
          label: "{title}"
        required: true

  - name: server_intro
    label: "①レンタルサーバ導入編"
    type: file
    path: content/server_intro.yml
    fields:
      - name: posts
        label: "記事一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "タイトル"
            type: string
            required: true
          - name: tag
            label: "タグ"
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{title}"
              label: "{title}"
            default: ["１学期前半"]
          - name: image
            label: "画像"
            type: image
          - name: body
            label: "本文"
            type: text
          - name: code_title
            label: "コードファイル名"
            type: string
          - name: code_lang
            label: "コードの言語"
            type: select
            options:
              values:
                - "html"
                - "php"
            default: "html"
          - name: code
            label: "コード"
            type: code
            options:
              language: html

  - name: personal_site
    label: "②個人サイト制作編"
    type: file
    path: content/personal_site.yml
    fields:
      - name: posts
        label: "記事一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "タイトル"
            type: string
            required: true
          - name: tag
            label: "タグ"
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{title}"
              label: "{title}"
            default: ["１学期後半"]
          - name: image
            label: "画像"
            type: image
          - name: body
            label: "本文"
            type: text
          - name: code_title
            label: "コードファイル名"
            type: string
          - name: code_lang
            label: "コードの言語"
            type: select
            options:
              values:
                - "html"
                - "php"
            default: "html"
          - name: code
            label: "コード"
            type: code
            options:
              language: html

  - name: HTTP_and_SQL
    label: "③HTTPリクエスト&SQL編"
    type: file
    path: content/HTTP_and_SQL.yml
    fields:
      - name: posts
        label: "記事一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "タイトル"
            type: string
            required: true
          - name: tag
            label: "タグ"
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{title}"
              label: "{title}"
            default: ["２学期前半"]
          - name: image
            label: "画像"
            type: image
          - name: body
            label: "本文"
            type: text
          - name: code_title
            label: "コードファイル名"
            type: string
          - name: code_lang
            label: "コードの言語"
            type: select
            options:
              values:
                - "html"
                - "php"
            default: "html"
          - name: code
            label: "コード"
            type: code
            options:
              language: html

  - name: top_links
    label: "トップページリンク集"
    type: file
    path: content/links.yml
    fields:
      - name: links
        label: "リンク一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: text
            label: "表示テキスト"
            type: string
            required: true
          - name: url
            label: "URL"
            type: string
            required: true
