media:
  input: content/images
  output: images

content:
  - name: tags
    label: "タグ管理"
    type: collection
    path: content/tags
    filename: "{primary}.yml"
    format: yaml
    fields:
      - name: name
        label: "タグ名"
        type: string
        required: true

  - name: settings
    label: "サイト設定"
    type: file
    path: content/settings.yml
    fields:
      - name: default_tag
        label: "デフォルト表示タグ"
        type: string
        required: true

  - name: server_intro
    label: "①レンタルサーバ導入編"
    type: file
    path: content/server_intro.yml
    fields:
      - name: posts
        label: "記事一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "タイトル"
            type: string
            required: true
          - name: tag
            label: "タグ"
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{primary}"
              label: "{primary}"
            default: ["１学期前半"]
          - name: image
            label: "画像"
            type: image
          - name: body
            label: "本文"
            type: text
          - name: code_title
            label: "コードファイル名"
            type: string
          - name: code_lang
            label: "コードの言語"
            type: select
            options:
              values:
                - "html"
                - "php"
            default: "html"
          - name: code
            label: "コード"
            type: code
            options:
              language: html

  - name: personal_site
    label: "②個人サイト制作編"
    type: file
    path: content/personal_site.yml
    fields:
      - name: posts
        label: "記事一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: "タイトル"
            type: string
            required: true
          - name: tag
            label: "タグ"
            type: reference
            options:
              collection: tags
              multiple: true
              value: "{primary}"
              label: "{primary}"
            default: ["１学期後半"]
          - name: image
            label: "画像"
            type: image
          - name: body
            label: "本文"
            type: text
          - name: code_title
            label: "コードファイル名"
            type: string
          - name: code_lang
            label: "コードの言語"
            type: select
            options:
              values:
                - "html"
                - "php"
            default: "html"
          - name: code
            label: "コード"
            type: code
            options:
              language: html

  - name: top_links
    label: "トップページリンク集"
    type: file
    path: content/links.yml
    fields:
      - name: links
        label: "リンク一覧"
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{text}"
        fields:
          - name: text
            label: "表示テキスト"
            type: string
            required: true
          - name: url
            label: "URL"
            type: string
            required: true
