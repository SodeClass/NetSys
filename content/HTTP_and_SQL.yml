  - title: ①データベースに触れる
    tag:
      - ２学期前半
    body: |-
      まずはVScodeで拡張機能 "SQLite3 Editor" をインストール。
      下のリンクからpokedex.dbをダウンロードし、プロジェクトフォルダ内に入れてVScodeで開いてみる。

      https://sodeclass.github.io/NetSys/pokedex.db
    code_lang: html
  - title: ②ポケモン検索ページを作る（準備編）
    tag:
      - ２学期前半
    body: serch_pokemon.phpファイルを新たに作り、以下の様に書き始める。
    code_title: serch_pokemon.php
    code_lang: php
    code: >-
      <?php

      // エラーを表示する設定（開発用）

      ini_set('display_errors', 1);

      error_reporting(E_ALL);


      // データベース(pokedex.db)に接続

      $db_file = 'pokedex.db';

      try {
          $db = new PDO("sqlite:" . __DIR__ . '/' . $db_file);
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
      } catch (PDOException $e) {
          die("データベースの接続に失敗しました: " . $e->getMessage());
      }


      $search_name = $_GET['name'] ?? '';

      $pokemons = [];


      // 入力がある場合のみ検索を実行

      if ($search_name !== '') {
          // 【SQLインジェクション未対策】
          // ユーザー入力をサニタイズ（無害化）せずに、そのままSQL文に文字列結合しています
          $sql = "SELECT * FROM pokemon WHERE name = '" . $search_name . "' ORDER BY id ASC";
          
          try {
              $stmt = $db->query($sql);
              if ($stmt) {
                  $pokemons = $stmt->fetchAll(PDO::FETCH_ASSOC);
              }
          } catch (PDOException $e) {
              // エラーをそのまま表示すると攻撃者にデータベース構造のヒントを与えてしまいます
              echo "SQL Error: " . $e->getMessage();
          }
      }

      ?>
