  - title: 【確認】作ったページの脆弱性を突こう
    tag:
      - ２学期前半
    body: |-
      今作ったページはセキュリティの面で非常にマズい。
      試しに脆弱性を突こう。

      ・SQLインジェクション
      検索欄に「' OR '1'='1」と入力して検索すると……？
      ※今回はポケモン図鑑なら問題ないが、顧客データだとどうなるだろうか。

      ・XSS
      検索欄に「"><script>alert("ハッキング成功！");</script>」と入力して検索すると……？
      ※いろいろな文字を表示してみよう。
    code_lang: html
  - title: ⑤SQLインジェクション対策（検索編のコード）
    tag:
      - ２学期前半
    body: |-
      検索を実行する際にprepare()とbindValue()を間にかませる。
      これで入力データが「単なる文字列」として処理される。
    code_title: serch_pokemon.php
    code_lang: php
    code: |-
      // 名前をGETメソッドでリクエスト
      $search_name = $_GET['name'] ?? '';   
      // 検索結果を入れる配列
      $pokemons = [];

      // 入力がある場合のみ検索を実行
      if ($search_name !== '') {
          // SQLの準備 (:name は後で変数を安全に入れるためのプレースホルダー)
          $stmt = $db->prepare("SELECT * FROM pokemon WHERE name LIKE :name ");
          // 変数を入れる前に、前後に % をくっつける（PHP側で文字列結合）
          $like_search_name = '%' . $search_name . '%';  
          // 変数の割り当て (セキュリティ対策)
          $stmt->bindValue(':name', $like_search_name, PDO::PARAM_STR);
          // 実行
          $stmt->execute();
          // 結果をすべて取得
          $pokemons = $stmt->fetchAll(PDO::FETCH_ASSOC);
      }
      ?>
  - title: XSS対策（表示編２のコード）
    tag:
      - ２学期前半
    body: htmlspecialchars()で引数を安全な文字に変換する。
    code_title: serch_pokemon.php
    code_lang: php
    code: >-
      <body>

          <h1>ポケモン検索</h1>

          <!-- 検索フォーム -->
          <div class="search-box">
              <form method="GET" action="search_pokemon.php">
                  <input type="text" name="name" value="<?= htmlspecialchars($search_name, ENT_QUOTES, 'UTF-8') ?>" placeholder="ここに名前を入力">
                  <button type="submit">検索</button>
              </form>
          </div>

          <!-- 検索結果のリスト表示 -->
          <?php if ($search_name === ''): ?>
              <p>ここに検索結果が表示されます</p>
          <?php elseif (count($pokemons) > 0): ?>
              <ul>
                  <?php foreach ($pokemons as $pokemon): ?>
                      <li>
                          No.<?= htmlspecialchars($pokemon['id'], ENT_QUOTES, 'UTF-8') ?> 
                          <strong><?= htmlspecialchars($pokemon['name'], ENT_QUOTES, 'UTF-8') ?></strong>
                          (<?= htmlspecialchars($pokemon['type1'], ENT_QUOTES, 'UTF-8') ?>
                          
                          <!-- タイプ2がある場合だけスラッシュとタイプ2を表示する -->
                          <?php if (!empty($pokemon['type2'])): ?>
                              / <?= htmlspecialchars($pokemon['type2'], ENT_QUOTES, 'UTF-8') ?>
                          <?php endif; ?>)
                          
                          たかさ: <?= htmlspecialchars($pokemon['height'], ENT_QUOTES, 'UTF-8') ?>m, 
                          おもさ: <?= htmlspecialchars($pokemon['weight'], ENT_QUOTES, 'UTF-8') ?>kg
                      </li>
                  <?php endforeach; ?>
              </ul>
          <?php else: ?>
              <p>ポケモンが見つかりませんでした。</p>
          <?php endif; ?>

      </body>

      </html>
