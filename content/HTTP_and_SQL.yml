posts:
  - title: ①データベースに触れる
    tag:
      - ２学期前半
    body: |-
      まずはVScodeで拡張機能 "SQLite3 Editor" をインストール。
      下のリンクからpokedex.dbをダウンロードし、プロジェクトフォルダ内に入れてVScodeで開いてみる。

      https://sodeclass.github.io/NetSys/pokedex.db
    code_lang: html
  - title: ②ポケモン検索ページを作る（準備編）
    tag:
      - ２学期前半
    body: serch_pokemon.phpファイルを新たに作り、以下の様に書き始める。
    code_title: serch_pokemon.php
    code_lang: php
    code: >-
      <?php

      // エラーを表示する設定

      ini_set('display_errors', 1);   //エラー表示をオン(1)に

      error_reporting(E_ALL);         //エラーをすべてreportさせる


      // データベース(pokedex.db)に接続

      $db_file = 'pokedex.db';

      try {
          $db = new PDO("sqlite:" . __DIR__ . '/' . $db_file);    //データベース操作関数PDOを呼びSQLiteでこのディレクトリの$db_fileを指定
          $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);   //設定変更して例外発生通知モードに
      } catch (PDOException $e) {
          die("データベースの接続に失敗しました: " . $e->getMessage());
      }
  - title: ③ポケモン検索ページを作る（検索編）
    tag:
      - ２学期前半
    body: |-
      今回のメイン。
      さっき書いたコードに続けて書く。

      ・GETメソッドとは
      HTTPリクエストの１つ。
      サーバーから「情報を取得する」ために用いる。
      リクエストデータ（=クエリ）はURLの末尾にくっつけて送信される。

      ・SQLとは
      リレーショナルデータベースを扱うための命令文。
      今回の内容はこんな感じ
      SELECT [欲しい列名] FROM [テーブル名] WHERE [条件]
    code_title: serch_pokemon.php
    code_lang: php
    code: >-
      // 名前をGETメソッドでリクエスト

      $search_name = $_GET['name'] ?? '';   

      // 検索結果を入れる配列

      $pokemons = [];


      // 入力がある場合のみ検索を実行

      if ($search_name !== '') {
          // SQLを実行
          $stmt = $db->query("SELECT * FROM pokemon WHERE name = '" . $search_name . "' ");
          // 結果をすべて取得
          $pokemons = $stmt->fetchAll(PDO::FETCH_ASSOC);
      }

      ?>
