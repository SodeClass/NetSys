  - title: ⑥SFTPの設定を書く
    tag:
      - １学期前半
    body: |-
      VScode上で
      表示→コマンドパレット→SFTP:config
      を選択すると「sftp.json」が作成される。

      画像の感じで書き換えよう。ホスト名、サーバーID、秘密鍵のパスは自分のやつで。

      ※portの書き換えを忘れないように。
      ※uploadOnSaveをtrueにしてください。セーブするたびアップロードする設定です。
      ※タイピングミスに注意！privateKeyPathのKは大文字です。
    code_title: sftp.json
    code_lang: html
    code: |
      {
          "name": "My Server",
          "host": ホスト名,
          "protocol": "sftp",
          "port": 10022,
          "username": サーバーID,
          "interactiveAuth": true,
          "remotePath": "/home/サーバーID/サーバーID.xsrv.jp/public_html",
          "uploadOnSave": true,
          "useTempFile": false,
          "openSsh": true,
          "privateKeyPath": "~/.ssh/サーバーID.key",
          "ignore": [
              ".vscode",
              ".git",
              ".DS_Store",
              "sftp.json",
          ]
      }
