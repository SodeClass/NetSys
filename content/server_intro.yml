  - title: |
      【目標②】ページを外部スタイルシート pico css で整える
    tag:
      - １学期前半
    body: |
      ![【目標②】ページを外部スタイルシート pico css で整える](../images/img_6a0173ef8a8e27.47059834.png)

      - 「index.html」を画像のように書き換え、 pico css を使って楽に見た目を整えていこう。

      headに追加する３行は以下をコピペしよう。
      &lt;meta charset=&quot;UTF-8&quot;&gt;
      &lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
      &lt;link rel=&quot;stylesheet&quot; href=&quot;https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css&quot;&gt;

      ※この段階ではさっきと変わらないが、スマホやダークテーマで開いてみると……？
    code_lang: html
  - title: ＋α　クローラー対策をする
    tag:
      - １学期前半
    body: |
      ![＋α　クローラー対策をする](../images/img_6a0aa3af463036.55216305.png)

      robots.txt ファイルを作成し、画像のように記述する。
      こうするとネット上の情報を収集するプログラム（クローラー）にサイトを覗かれないようになり、検索結果に載らなくなる等の効果がある。
      いわば魔除け。

      User-agent: *  ← すべてのクローラーに対して
      Disallow: /       ← すべてのファイルの閲覧を許可しない
    code_lang: html
  - title: ＋α　SSLを設定する
    tag:
      - １学期前半
    body: |
      ![＋α　SSLを設定する](../images/img_6a0a9d44d312e7.92729271.png)

      エックスサーバーの サーバーパネル &gt; ドメイン &gt; SSL設定 から、無料独自SSLをONにする。
      こうすると、「保護されていない通信」という警告が出なくなる。
    code_lang: html
