  - title: |
      ⑧初めに表示されるページを作る
    tag:
      - １学期前半
    body: |
      「index.html」を画像の感じで書く。文章は好きに変えよう。
    code_title: index.html
    code_lang: html
    code: |-
      <!DOCTYPE html>
      <html lang="ja">
      <head>
          <meta charset="utf-8">
          <title>タブに表示するタイトル</title>
      </head>
      <body>
          <h1>見出し</h1>
          <p>個人サイトができました！</p>
      </body>
      </html>
  - title: |
      【目標①】ブラウザで確認する
    tag:
      - １学期前半
    body: "- URL（サーバーID.xsrv.jp）を入力してアクセスし、PCとスマホの両方で表示できることを確かめよう。"
    code_lang: html
  - title: |
      【目標②】ページを外部スタイルシート pico css で整える
    tag:
      - １学期前半
    body: >
      - 「index.html」を画像のように書き換え、 pico css を使って楽に見た目を整えていこう。


      headに追加する３行は以下をコピペしよう。
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">

      ※この段階ではさっきと変わらないが、スマホやダークテーマで開いてみると……？
    code_title: index.html
    code_lang: html
    code: >-
      <!DOCTYPE html>

      <html lang="ja">

      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
          <title>タブに表示されるタイトル</title>
      </head>

      <body>
          <main class="container">
              <article>
                  <h1>見出し</h1>
                  <p>個人サイトができました！</p>
              </article>
          </main>
      </body>

      </html>
  - title: ＋α　クローラー対策をする
    tag:
      - ２学期前半
    body: |
      index.htmlの<head>タグ内に以下を追加

      robots.txtは消しておいてください
    code_title: index.html
    code_lang: html
    code: <meta name="robots" content="noindex">
  - title: ＋α　SSLを設定する
    tag:
      - １学期前半
    body: |
      ![＋α　SSLを設定する](../images/img_6a0a9d44d312e7.92729271.png)

      エックスサーバーの サーバーパネル &gt; ドメイン &gt; SSL設定 から、無料独自SSLをONにする。
      こうすると、「保護されていない通信」という警告が出なくなる。
    code_lang: html
