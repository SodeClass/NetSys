  - 
    title: ⑥秘密のリンクを作る
    tag: １学期後半, 秘密のページ
    body: |
      index.htmlのmainの下に書き加える。
      パスワードは各自で決める。
      色はサイトの背景色と一致させよう。
      
      ```
      </main>
      
      <a href="secret.html"
      onclick="const p = prompt('パスワードを入力してください'); if(p !== '自分で決めたパスワード') return false;"
