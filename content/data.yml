  - 
    title: >
      【課題】相手の隠し部屋に不正アクセスしよう
    tag: １学期後半, 秘密のページ
    body: |
      ⑤⑥で作成したパスワードロックはセキュリティが非常に低い！
      パスワードを直接聞かずに、セキュリティの穴を見つけて他の人の隠し部屋にアクセスしよう。
  - 
    title: >
      ⑦セキュリティを強化する（index編）
    tag: １学期後半, 秘密のページ
    body: |
      まずはindex.htmlに張ったリンクのパスワードを外そう。
      パスワードを聞くのはsecret.htmlを開いた後にする。
      
      ```
      <a href="secret.php" style="color: cornsilk;">
      隠し部屋
      </a>
      ```
    code_title: index.html
  - 
    title: >
      ⑧セキュリティを強化する（secret編①）
    tag: １学期後半, 秘密のページ
    body: |
      secret.htmlのファイル名をsecret.phpにする。
      htmlだとそのまま表示するだけだが、phpはサーバー内でプログラムを実行した結果が表示される。
      
      といってもhtmlの内容をそのまま使えるので、とりあえずファイル名だけ変えておけばOK。
      新しく作ったファイルは右クリックでuploadしよう。
      元のsecret.htmlはサーバーに残ったままなので、削除しておく。
  - 
    title: >
      ⑨セキュリティを強化する（secret編②）
    tag: １学期後半, 秘密のページ
    body: |
      元々あったsecretの内容の真上に追加で記述する。
      <!DOCTYPE html>から</html>までは他のところからコピペして要らないところを消そう。
      
      ~~~以下ざっくりとした説明~~~
      <?php  >で囲んだ部分（if文の始めと終わりの二か所）はプログラムとして認識され、ページのソース表示では表示されない。
      囲まれていないところはただのHTML扱い。
      
      
      
      ```
      <?php
      // === パスワード設定 ===
      // パスワードは英数字または記号にしてください（変換できないので）
      $password = 'zibun-de-kimetene';
      
      // === パスワードの判定 ===
      // パスワードが入力されていない、または入力されたパスワードが間違っている場合の処理
      if (!isset($_POST['password']) || $_POST['password'] !== $password) {
      ?>
      <!DOCTYPE html>
      <html lang="ja" data-theme="light">
      <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
      <title>パスワード入力</title>
      <style>
      :root {
      --pico-font-family: "Take Bold", sans-serif;
      }
      body {
      min-height: 100vh;
      padding-top: 3rem;
      background-color: cornsilk;
      text-align: center;
      }
      article {
      max-width: 500px;
      margin: 0 auto;
      border-radius: 0.5rem;
      }
      </style>
      </head>
      <body>
      <main class="container">
      　　
      　　　　<!-- この場所にこのあと記述します -->
      
      </main>
      </body>
      </html>
      <?php
      // ここで処理を終了し、パスワードが合っていない限り下にある本来のページ(HTML)を表示させない
      exit;
      }
      ?>
      /* 以下元々あったsecretの内容 */
      ```
    code_title: secret.php
  - 
    title: >
      ⑩セキュリティを強化する（secret編③）
    tag: １学期後半, 秘密のページ
    body: |
      <body>内に記述していく。
      
      ```
      <body>
      <main class="container">
      <article>
      <form method="post" action="secret.php">    <!-- POST方式でデータを隠して送り、自分自身に送信するフォーム -->
      <label for="password">パスワードを入力してください:</label>     <!-- 入力欄の見出し（説明文） -->
      <input type="password" name="password" id="password" required>   <!-- 入力枠。文字を隠し、PHPに名前を渡し、空送信を防ぐ -->
      <?php if (isset($_POST['password'])): ?>    <!-- もし送信ボタンが押されてデータが存在していたら（送信後だったら） -->
      <p style="color: red;">パスワードが違います。</p>
      <?php endif; ?>
      <button type="submit">送信</button>     <!-- 入力データをまとめて送信するボタン -->
      </form>
      </article>
      </main>
      </body>
      ```
    code_title: secret.php
  - 
    title: >
      【目標】index.htmlとsecret.phpを自分専用に作ろう
    tag: １学期後半
    body: |
      ただ書き写しただけでは身についたとは言えない！
      自分なりに文字列、数値をいじって自分だけの個人サイトを作ろう。
      secret.phpは誰からも見られない（はず）なので、リンク集を残しておけば後は何をやってもOK。
      
      ※次回は口頭試問をします。
