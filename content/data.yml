  - 
    title: ＋α　クローラー対策をする
    tag: １学期前半
    body: |
      ![＋α　クローラー対策をする](../images/img_6a0aa3af463036.55216305.png)
      
      robots.txt ファイルを作成し、画像のように記述する。
      こうするとネット上の情報を収集するプログラム（クローラー）にサイトを覗かれないようになり、検索結果に載らなくなる等の効果がある。
      いわば魔除け。？
      
      User-agent: *  ← すべてのクローラーに対して
      Disallow: /       ← すべてのファイルの閲覧を許可しない
  - 
